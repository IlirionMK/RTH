services:
  nginx:
    image: nginx:1.31-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/backend
      - vendor:/var/www/backend/vendor
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm install --no-fund --no-audit && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
    environment:
      VITE_USE_POLLING: "true"
      VITE_API_URL: http://localhost:8000/api

  postgres:
    image: postgres:19-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: rth
      POSTGRES_USER: rth
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rth -d rth"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
  vendor:
